<title>Orient to Plan</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Manrope:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EBDC;
    --paper: #FAF6EC;
    --ink: #1B1814;
    --ink-soft: #4A4339;
    --ink-faint: #847B6B;
    --rule: #D9CFB8;
    --accent: #B14A1F;
    --accent-faint: rgba(177,74,31,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    /* Lock the gate to the visual viewport. Without this iOS Safari can
       pick a layout viewport > device on first load, and that state
       sticks across the document.write(decryptedHtml) that happens on
       unlock, leaving the main page pinch-to-fit on mobile. */
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    background: var(--bg);
    font-family: 'Manrope', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gate { width: min(400px, calc(100vw - 32px)); padding: 24px 20px; }
  .brand-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand span { color: var(--accent); font-style: normal; font-weight: 600; }
  .version {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .subtitle { font-size: 13px; color: var(--ink-faint); margin-bottom: 32px; }
  .field { position: relative; margin-bottom: 12px; }
  .field input {
    width: 100%;
    padding: 13px 46px 13px 16px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--paper);
    font-family: inherit;
    /* Must be >= 16px or iOS WebKit auto-zooms in when this input
       receives focus. autofocus below triggers focus on load, so any
       font-size below 16px immediately pinches the page in ~7% and
       that scale state then persists across document.write(unlocked). */
    font-size: 16px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 0.05em;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-faint);
  }
  .toggle-vis {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 4px;
    display: flex; align-items: center;
  }
  .toggle-vis:hover { color: var(--ink); }
  .toggle-vis svg { width: 16px; height: 16px; }
  .btn {
    width: 100%;
    padding: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .btn:hover { background: #2c2820; }
  .btn:disabled { background: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  .error {
    margin-top: 12px;
    padding: 10px 14px;
    background: #f5e4d8;
    border-radius: 8px;
    font-size: 13px;
    color: var(--accent);
    display: none;
  }
  .error.show { display: block; }
  .loading {
    margin-top: 16px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    display: none;
  }
  .loading.show { display: block; }
</style>
</head>
<body>
<div class="gate">
  <div class="brand-row">
    <span class="brand">orient to <span>plan</span></span>
    <span class="version">poc-v0.21.1</span>
  </div>
  <div class="subtitle">Enter the password to continue.</div>
  <div class="field">
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="toggle-vis" id="toggleVis" type="button" aria-label="Show password">
      <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
  <button class="btn" id="unlockBtn">Unlock</button>
  <div class="error" id="errMsg">Wrong password. Try again.</div>
  <div class="loading" id="loadingMsg">Decrypting...</div>
</div>

async function deriveKey(password, salt, iterations) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false, ["decrypt"]
  );
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function decrypt(password) {
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);
  const key = await deriveKey(password, salt, PAYLOAD.iterations);
  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return new TextDecoder().decode(decrypted);
}

const pwInput = document.getElementById('pw');
const btn = document.getElementById('unlockBtn');
const errMsg = document.getElementById('errMsg');
const loadingMsg = document.getElementById('loadingMsg');
const toggleVis = document.getElementById('toggleVis');

toggleVis.addEventListener('click', () => {
  const isPassword = pwInput.type === 'password';
  pwInput.type = isPassword ? 'text' : 'password';
  document.getElementById('eyeIcon').innerHTML = isPassword
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

async function attempt() {
  const pw = pwInput.value.trim();
  if (!pw) return;
  btn.disabled = true;
  errMsg.classList.remove('show');
  loadingMsg.classList.add('show');
  try {
    const html = await decrypt(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    errMsg.classList.add('show');
    loadingMsg.classList.remove('show');
    btn.disabled = false;
    pwInput.value = '';
    pwInput.focus();
  }
}
btn.addEventListener('click', attempt);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
</script>
